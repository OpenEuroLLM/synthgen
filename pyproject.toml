[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthgen"
version = "0.1.0"
description = "Multilingual synthetic instruction-following data generation for the OELLM project."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Abhash Jha", email = "abhash.kumar.jha@tue.ellis.eu" }]
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.27",
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
topics = ["datasets>=2.20"]
dev    = ["ruff>=0.5", "pytest>=8"]

[project.scripts]
synthgen = "synthgen.cli:main"

[tool.setuptools.packages.find]
include = ["synthgen*"]
exclude = ["pilot*", "outputs*", "logs*"]

[tool.ruff]
line-length = 100
target-version = "py310"
